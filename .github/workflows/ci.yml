name: CI

on:
  push:
    branches: [main, master, madhu1207]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-cov
      - name: Run pytest
        env:
          USE_DATABRICKS: "false"
        run: pytest tests/ -v --cov=app --cov=config --cov=services --cov-report=term-missing
