<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pipeline Data Portal</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-brand">
        <div class="logo">📊</div>
        <div>
          <h1>Pipeline Data Portal</h1>
          <p class="subtitle">Manage pipeline data shared with DataOps Copilot</p>
        </div>
      </div>
      <div class="header-actions">
        <span class="status-badge" id="db-status">Checking database...</span>
        <a href="http://localhost:5000" target="_blank" class="link-btn">Open DataOps Copilot ↗</a>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab active" data-tab="pipelines">Pipeline Runs</button>
      <button class="tab" data-tab="failures">Failure Logs</button>
      <button class="tab" data-tab="clusters">Cluster Metrics</button>
    </nav>

    <main class="main">
      <section class="panel active" id="panel-pipelines">
        <div class="panel-header">
          <h2>Pipeline Runs</h2>
          <button class="btn primary" id="btn-add-pipeline">+ Add Pipeline</button>
        </div>
        <div class="table-wrap" id="pipelines-table"></div>
      </section>

      <section class="panel" id="panel-failures">
        <div class="panel-header">
          <h2>Failure Logs</h2>
          <button class="btn primary" id="btn-add-failure">+ Add Failure</button>
        </div>
        <div class="table-wrap" id="failures-table"></div>
      </section>

      <section class="panel" id="panel-clusters">
        <div class="panel-header">
          <h2>Cluster Metrics</h2>
          <button class="btn primary" id="btn-add-cluster">+ Add Cluster</button>
        </div>
        <div class="table-wrap" id="clusters-table"></div>
      </section>
    </main>
  </div>

  <div class="modal hidden" id="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title">Form</h3>
        <button class="close-btn" id="modal-close">&times;</button>
      </div>
      <form id="modal-form"></form>
      <div class="modal-footer">
        <button type="button" class="btn" id="modal-cancel">Cancel</button>
        <button type="submit" form="modal-form" class="btn primary" id="modal-save">Save</button>
      </div>
    </div>
  </div>

  <div class="toast hidden" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
